spring:
  datasource:
    url: jdbc:h2:mem:chatwebsocket-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always

app:
  data-reset:
    idle-timeout: PT0S
    check-interval-ms: 3600000
    initial-delay-ms: 3600000
